name: Cache-Clean

on:
  #自动清理：每周一早上4点
  schedule:
    - cron: 0 20 * * 0
  #手动清理
  workflow_dispatch:

permissions: write-all

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Projects
        uses: actions/checkout@main

      - name: Cache Clean
        run: |
          # gh cache delete --all 在「当前没有任何缓存」时返回 exit 1 ("X No caches to delete"),
          # 会把整条定时任务标记成 failure. 先判空, 没缓存就直接正常退出.
          if [ -z "$(gh cache list --limit 1)" ]; then
            echo "No caches to delete."
            exit 0
          fi
          gh cache delete --all
